[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "createcart-shipping"
version = "0.1.0"
description = "CreateCart Shipping SDK — pincode serviceability, rate quotes, shipment manifestation, tracking, cancellation and pickup requests, behind a pluggable courier provider (Delhivery B2C Express + Mock)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CreateCart" }]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/createcart_shipping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
